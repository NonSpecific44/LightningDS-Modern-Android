name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test

      - name: Build APKs
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease 

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LightningDS-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LightningDS-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LightningDS-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lightning DS ${{ github.ref_name }}
          files: dist/*.apk
          body: |
            Lightning DS rebuilt for modern Android (8.0+), phones and tablets.

            **Install:** download `LightningDS-${{ github.ref_name }}.apk` on your device and open it (allow installing from unknown sources when asked). Your device must be on the same network as your Lightning device.

            * `LightningDS-${{ github.ref_name }}.apk`: recommended build (`com.lightningds.modern`).
            * `LightningDS-${{ github.ref_name }}-debug.apk`: debug build, installs alongside (`com.lightningds.modern.debug`).

            **Notes**
            * Internet radio uses the radio-browser.info directory (vTuner needed AURALiC's partner key).
            * TIDAL / Qobuz sign-in needs your own API credentials (Settings → Streaming services). Playback is done by the Lightning device and depends on its firmware.
            * Not yet tested on real AURALiC hardware. Please report problems in Issues.
            * Signed with the public key in `app/debug.keystore`.
