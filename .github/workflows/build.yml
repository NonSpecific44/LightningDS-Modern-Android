name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v2.0.0); leave empty to just build"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set by a pushed v* tag, or by the release_tag input of a manual run.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test

      - name: Build APKs
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease 

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LightningDS-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release files
        if: env.RELEASE_TAG != ''
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LightningDS-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LightningDS-${RELEASE_TAG}-debug.apk"

      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Lightning DS ${{ env.RELEASE_TAG }}
          files: dist/*.apk
          body: |
            Lightning DS rebuilt for modern Android (8.0+), phones and tablets.

            **Install:** download `LightningDS-${{ env.RELEASE_TAG }}.apk` on your device and open it (allow installing from unknown sources when asked). Your device must be on the same network as your Lightning device.

            * `LightningDS-${{ env.RELEASE_TAG }}.apk`: recommended build (`com.lightningds.modern`).
            * `LightningDS-${{ env.RELEASE_TAG }}-debug.apk`: debug build, installs alongside (`com.lightningds.modern.debug`).

            **Notes**
            * Internet radio uses the radio-browser.info directory (vTuner needed AURALiC's partner key).
            * TIDAL / Qobuz sign-in needs your own API credentials (Settings → Streaming services). Playback is done by the Lightning device and depends on its firmware.
            * Not yet tested on real AURALiC hardware. Please report problems in Issues.
            * Signed with the public key in `app/debug.keystore`.
